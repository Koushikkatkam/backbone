name: Security & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Enforce strict least-privilege permissions across all jobs
permissions:
  contents: read

jobs:
  security-and-quality:
    name: Code Quality, Security & Invariant Tests
    runs-on: ubuntu-latest

    steps:
      # Pin actions to immutable commit SHAs for supply chain security
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js Runtime
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Initialize Local Environment
        run: cp .env.example .env

      - name: Generate Prisma ORM Client
        run: npm run db:generate

      - name: Initialize Database Schema
        run: npm run db:push

      - name: Seed Baseline Pilot Dataset
        run: npm run db:seed

      - name: Dependency Security Audit
        run: npm audit --audit-level=high

      - name: ESLint Code Quality Verification
        run: npm run lint

      - name: TypeScript Strict Typecheck
        run: npm run typecheck

      - name: Automated Invariant & Security Test Suite
        run: npm run test

      - name: Production Build Compilation
        run: npm run build
